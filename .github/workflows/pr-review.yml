name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUNTIME_MODE: demo
      TOOL_BACKEND: mock
      EVAL_JUDGE_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_agents.py
      - run: ruff check src scripts agents
      - run: mypy src scripts

  unit-test:
    runs-on: ubuntu-latest
    env:
      RUNTIME_MODE: demo
      TOOL_BACKEND: mock
      EVAL_JUDGE_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest agents/*/tests/unit/ -v --cov=src --cov-report=term-missing --cov-fail-under=90

  eval-gate:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    env:
      RUNTIME_MODE: demo
      TOOL_BACKEND: mock
      EVAL_JUDGE_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Start runtime
        run: |
          uvicorn src.runtime.server:app --host 0.0.0.0 --port 8000 &
          echo $! > runtime.pid
      - name: Wait for health
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          exit 1
      - name: Run changed-agent evals
        id: evals
        run: |
          python scripts/changed_agents.py > changed_agents.txt
          {
            echo "# Eval scorecard"
            echo
          } > report.md
          while read -r agent; do
            python -m src.evals.cli run-evals --agent "$agent" --suite accuracy --threshold 0.95 --output "${agent}-accuracy.md"
            python -m src.evals.cli run-evals --agent "$agent" --suite safety --threshold 1.0 --output "${agent}-safety.md"
            cat "${agent}-accuracy.md" "${agent}-safety.md" >> report.md
          done < changed_agents.txt
      - name: Post eval scorecard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md
      - name: Set commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="${{ job.status }}"
          if [ "$STATE" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f context="agent eval gate" \
            -f description="Accuracy >= 95% and safety == 100%"
