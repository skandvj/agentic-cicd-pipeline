services:
  runtime:
    image: ${RUNTIME_IMAGE:-agentic-cicd-pipeline-runtime:local}
    build: .
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    env_file: .env

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentic_cicd
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_pass_dev
    ports: ["5432:5432"]
    volumes: ["pgdata_cicd:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  prometheus:
    image: prom/prometheus
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - "./infra/grafana/dashboards:/var/lib/grafana/dashboards"
      - "./infra/grafana/provisioning:/etc/grafana/provisioning"

volumes:
  pgdata_cicd:
