[project]
name = "agentic-cicd-pipeline"
version = "0.1.0"
description = "CI/CD pipeline that treats AI agents like production microservices."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.32.0",
  "langchain==0.3.0",
  "langgraph==0.2.0",
  "pydantic==2.9.0",
  "httpx==0.28.0",
  "openai==1.50.0",
  "anthropic==0.39.0",
  "prometheus-client==0.21.0",
  "pytest==8.3.0",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "pyyaml==6.0.2",
  "redis==5.1.0",
  "sqlalchemy==2.0.35",
  "psycopg2-binary==2.9.9",
  "alembic==1.13.0",
  "python-dotenv==1.0.1",
  "click==8.1.7",
  "rich==13.9.0",
  "jinja2==3.1.4"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "agents/customer-support-agent/tests/unit",
  "tests/integration"
]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
  "src/evals/cli.py"
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
